            ];

            var gallery = document.getElementById('photoGallery');
            var pagination = document.getElementById('photoPagination');
            var modal = document.getElementById('photoModal');
            var modalImage = document.getElementById('photoModalImage');
            var modalCaption = document.getElementById('photoModalTitle');
            var prevPhoto = document.querySelector('[data-prev-photo]');
            var nextPhoto = document.querySelector('[data-next-photo]');
            var photosPerPage = 15;
            var currentPage = 0;
            var currentPhotoIndex = 0;

            function renderGallery() {
                var start = currentPage * photosPerPage;
                var pagePhotos = photos.slice(start, start + photosPerPage);
                gallery.innerHTML = pagePhotos.map(function (photo, index) {
                    var globalIndex = start + index;
                    return '<button class="photo-card" type="button" data-index="' + globalIndex + '"><img src="' + photo.src + '" alt="' + photo.alt + '"></button>';
                }).join('');

                gallery.querySelectorAll('.photo-card').forEach(function (card) {
                    card.addEventListener('click', function () {
                        var index = parseInt(this.getAttribute('data-index'), 10);
                        openModal(index);
                    });
                });
            }

            function renderPagination() {
                var pageCount = Math.ceil(photos.length / photosPerPage);
                if (pageCount <= 1) {
                    pagination.innerHTML = '';
                    return;
                }
                var buttons = [];
                for (var i = 0; i < pageCount; i++) {
                    buttons.push('<button class="photo-page-button' + (i === currentPage ? ' is-active' : '') + '" type="button" data-page="' + i + '">' + (i + 1) + '</button>');
                }
                pagination.innerHTML = buttons.join('');
                pagination.querySelectorAll('.photo-page-button').forEach(function (button) {
                    button.addEventListener('click', function () {
                        currentPage = parseInt(this.getAttribute('data-page'), 10);
                        renderGallery();
                        renderPagination();
                        window.scrollTo({ top: gallery.offsetTop - 130, behavior: 'smooth' });
                    });
                });
            }

            if (gallery) {
                renderGallery();
                renderPagination();
            }

            function openModal(index) {
                currentPhotoIndex = index;
                showModalPhoto(currentPhotoIndex);
                modal.classList.add('is-open');
                modal.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }

            function showModalPhoto(index) {
                if (index < 0) {
                    index = photos.length - 1;
                }
                if (index >= photos.length) {
                    index = 0;
                }
                currentPhotoIndex = index;
                var photo = photos[currentPhotoIndex];
                modalImage.src = photo.src;
                modalImage.alt = photo.alt;
                modalCaption.textContent = photo.alt;
            }

            function closeModal() {
                modal.classList.remove('is-open');
                modal.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
            }

            if (prevPhoto && nextPhoto) {
                prevPhoto.addEventListener('click', function () {
                    showModalPhoto(currentPhotoIndex - 1);
                });
                nextPhoto.addEventListener('click', function () {
                    showModalPhoto(currentPhotoIndex + 1);
                });
            }

            if (modal) {
                modal.querySelectorAll('[data-close-photo-modal]').forEach(function (button) {
                    button.addEventListener('click', closeModal);
                });

                modal.addEventListener('click', function (event) {
                    if (event.target === modal) {
                        closeModal();
                    }
                });

                document.addEventListener('keydown', function (event) {
                    if (event.key === 'Escape') {
                        closeModal();
                    }
                });
            }
